<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PoC - Vulnerabilidade de Clickjacking</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; }
       .container { margin-top: 50px; }
       .iframe-container {
            position: relative;
            width: 900px;
            height: 600px;
            margin: 0 auto;
            border: 2px solid #ccc;
            background-color: white;
        }
        /* O iframe é para a prova visual */
        iframe { width: 100%; height: 100%; border: none; }
        
        /* O object é usado apenas para a detecção técnica e fica invisível */
        #detector { position: absolute; width: 0; height: 0; visibility: hidden; }

       .status-box {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px;
            padding: 15px;
            border-radius: 5px;
            display: inline-block;
            min-width: 300px;
        }
       .vulneravel { color: white; background-color: #d9534f; } /* Vermelho */
       .seguro { color: white; background-color: #5cb85c; }     /* Verde */
       .processando { color: #333; background-color: #f0ad4e; } /* Laranja */
    </style>
</head>
<body>

    <div class="container">
        <h1>Análise de Segurança (Clickjacking)</h1>
        
        <div id="resultado" class="status-box processando">ANALISANDO RESPOSTA...</div>
        
        <div class="iframe-container">
            <!-- trocar a referência do site abaixo -->
            <iframe id="target-frame" src="https://www.ciamuller.com.br"></iframe>
        </div>
        
        <!-- trocar a referência do site abaixo -->
        <object id="detector" data="https://www.ciamuller.com.br" type="text/html">
            <div id="fallback-marker" style="height:10px; width:10px;"></div>
        </object>
    </div>

    <script>
        const statusDiv = document.getElementById('resultado');
        const marker = document.getElementById('fallback-marker');
        let verificado = false;

        function realizarCheck() {
            if (verificado) return;

            // Se o marker tiver altura, significa que o browser falhou ao carregar o site
            // e renderizou o fallback interno. Logo, o site está SEGURO.
            if (marker && marker.offsetHeight > 0) {
                statusDiv.innerText = "SITE NÃO VULNERÁVEL (BLOQUEADO)";
                statusDiv.className = "status-box seguro";
            } else {
                // Se o marker não foi renderizado, o site foi carregado com sucesso.
                // Logo, está VULNERÁVEL.
                statusDiv.innerText = "SITE VULNERÁVEL";
                statusDiv.className = "status-box vulneravel";
            }
            verificado = true;
        }

        // Aguarda 4 segundos para garantir que a rede respondeu e o browser decidiu o bloqueio
        setTimeout(realizarCheck, 4000);

        // Opcional: listener de interação manual (vulnerabilidade definitiva)
        window.addEventListener('blur', function() {
            if (document.activeElement === document.getElementById('target-frame')) {
                statusDiv.innerText = "SITE VULNERÁVEL (INTERAÇÃO DETECTADA)";
                statusDiv.className = "status-box vulneravel";
                verificado = true;
            }
        });
    </script>

</body>
</html>
